<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>THE INTESTELLER TRAVLER</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

/* =========================
   LANDSCAPE WARNING
========================= */

#rotateWarning {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #02030a;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.warningBox {
    max-width: 400px;
}

.warningIcon {
    font-size: 60px;
    margin-bottom: 15px;
}

/* =========================
   TOP HUD
========================= */

#hud {
    position: fixed;
    left: 15px;
    top: 12px;
    z-index: 20;
    color: white;
    pointer-events: none;
}

#title {
    font-size: clamp(16px, 2.2vw, 28px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow:
        0 0 8px #4da6ff,
        0 0 20px #1478ff;
}

#location {
    margin-top: 5px;
    font-size: clamp(11px, 1.4vw, 16px);
    color: #8fc7ff;
}

/* =========================
   DESTINATION PANEL
========================= */

#panel {
    position: fixed;
    right: 15px;
    top: 15px;
    width: min(360px, 38vw);
    max-height: calc(100vh - 30px);
    z-index: 30;

    background:
        linear-gradient(
            135deg,
            rgba(8,15,35,.94),
            rgba(3,6,18,.88)
        );

    border: 1px solid rgba(90,170,255,.45);
    border-radius: 16px;
    padding: 14px;

    color: white;

    box-shadow:
        0 0 25px rgba(0,100,255,.18),
        inset 0 0 20px rgba(0,120,255,.05);

    backdrop-filter: blur(10px);

    overflow-y: auto;
}

.panelTitle {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.category {
    border: 1px solid rgba(100,180,255,.35);
    background: rgba(20,40,80,.65);
    color: #d8ecff;

    padding: 9px 4px;
    border-radius: 9px;

    font-size: 11px;
    font-weight: bold;

    cursor: pointer;
}

.category.active {
    background: rgba(35,130,255,.65);
    border-color: #69b7ff;
    box-shadow: 0 0 12px rgba(50,150,255,.35);
}

.destinations {
    margin-top: 10px;
    display: grid;
    gap: 7px;
}

.destination {
    padding: 10px;
    border-radius: 9px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);

    cursor: pointer;
}

.destination:hover,
.destination:active {
    background: rgba(30,100,180,.3);
}

.destinationName {
    font-size: 13px;
    font-weight: bold;
}

.destinationInfo {
    margin-top: 3px;
    font-size: 10px;
    color: #91a9c8;
}

#travelButton {
    width: 100%;
    margin-top: 12px;

    padding: 12px;

    border: none;
    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #1265e8,
            #6c25ff
        );

    color: white;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 18px rgba(60,100,255,.35);
}

#travelButton:active {
    transform: scale(.97);
}

/* =========================
   SHIP INFO
========================= */

#shipInfo {
    position: fixed;
    left: 15px;
    bottom: 15px;
    z-index: 20;

    color: #b8d9ff;
    font-size: 11px;

    background: rgba(0,0,0,.4);
    padding: 8px 11px;
    border-radius: 8px;

    pointer-events: none;
}

/* =========================
   WARP
========================= */

#warp {
    position: fixed;
    inset: 0;
    z-index: 50;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.03) 0%,
            rgba(0,0,0,0) 40%,
            rgba(0,0,0,.8) 100%
        );
}

#warp.active {
    animation: warpPulse 4s ease-in-out;
}

@keyframes warpPulse {

    0% {
        opacity: 0;
    }

    15% {
        opacity: .2;
    }

    35% {
        opacity: .8;
    }

    60% {
        opacity: 1;
    }

    85% {
        opacity: .7;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   WARP TEXT
========================= */

#warpText {
    position: fixed;
    inset: 0;

    z-index: 60;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: clamp(22px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: 5px;

    opacity: 0;
    pointer-events: none;

    text-shadow:
        0 0 10px #5eb7ff,
        0 0 30px #246cff;
}

#warpText.active {
    animation: warpTextAnim 4s ease;
}

@keyframes warpTextAnim {

    0%, 15% {
        opacity: 0;
        transform: scale(.7);
    }

    30%, 70% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.4);
    }
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #010208;

    color: white;
}

.loaderBox {
    text-align: center;
}

.loaderTitle {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
}

.loaderBar {
    width: 260px;
    height: 4px;

    margin-top: 20px;

    background: #172035;
    border-radius: 10px;
    overflow: hidden;
}

.loaderProgress {
    height: 100%;
    width: 0%;

    background: linear-gradient(
        90deg,
        #2078ff,
        #8d4cff
    );

    transition: width .2s;
}

/* =========================
   FPS
========================= */

#fps {
    position: fixed;
    bottom: 10px;
    right: 15px;

    z-index: 30;

    font-size: 10px;
    color: rgba(255,255,255,.45);

    pointer-events: none;
}

@media (orientation: portrait) {
    #rotateWarning {
        display: flex;
    }

    #game,
    #hud,
    #panel,
    #shipInfo,
    #fps {
        display: none;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="rotateWarning">
    <div class="warningBox">
        <div class="warningIcon">📱↔️</div>
        <h2>LANDSCAPE MODE REQUIRED</h2>
        <p>
            Rotate your device sideways to play
            THE INTESTELLER TRAVLER.
        </p>
    </div>
</div>

<div id="loading">
    <div class="loaderBox">
        <div class="loaderTitle">
            THE INTESTELLER TRAVLER
        </div>

        <div class="loaderBar">
            <div
                id="loaderProgress"

        </div>

        <p id="loadingText">

    </div>
</div>

<div id="hud">

    <div id="title">
        THE INTESTELLER TRAVLER
    </div>

    <div id="location">
        LOCATION: EARTH ORBIT
    </div>

</div>

<div id="panel">

    <div class="panelTitle">
        DESTINATION
    </div>

    <div class="categories">

        <button class="category active"
                data-type="planet">
            🪐 PLANETS
        </button>

        <button class="category"
                data-type="star">
            ⭐ STARS
        </button>

        <button class="category"
                data-type="galaxy">
            🌌 GALAXIES
        </button>

        <button class="category"
                data-type="blackhole">
            🕳️ BLACK HOLES
        </button>

        <button class="category"
                data-type="nebula">
            ☁️ NEBULAE
        </button>

        <button class="category"
                data-type="other">
            ✨ OTHER
        </button>

    </div>

    <div
        id="destinations"
        class="destinations">
    </div>

    <button id="travelButton">
        INITIATE WARP

</div>

<div id="shipInfo">
    DRAG: ROTATE SHIP &nbsp; • &nbsp;
    PINCH: ZOOM
</div>

<div id="fps">
    FPS: --
</div>

<div id="warp"></div>

<div id="warpText">
    INITIATING WARP
</div>

<script type="module">

/* =========================================================

========================================================= */

import { GLTFLoader } from

/* =========================================================

========================================================= */

let scene;
let camera;
let renderer;

let ship = null;

let earth;
let sun;

let destinationObjects = [];

let selectedDestination = null;

let stars;

let warpStars;

let isWarping = false;

let clock = new THREE.Clock();

let lastTime = performance.now();
let frameCount = 0;


/* =========================================================

========================================================= */

const game = document.getElementById("game");

const loading =

const loaderProgress =

const loadingText =

const destinationsElement =

const locationElement =

const travelButton =
    document.getElementById("travelButton");

const warp =

const warpText =
    document.getElementById("warpText");

const fpsElement =

/* =========================================================

const destinations = {

/* =========================================================
   INIT
========================================================= */

function init() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x000207);

    scene.fog =
        new THREE.FogExp2(
            0x000207,
            0.0007
        );


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        5000
    );

    camera.position.set(

        4,
        12

    /* RENDERER */

    renderer = new THREE.WebGLRenderer({

        antialias: false,

        powerPreference:

    });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    game.appendChild(
        renderer.domElement
    );


    /* LIGHTING */

    const ambient =
        new THREE.HemisphereLight(
            0x88aaff,
            0x02030a,
            1.2
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

    directional.position.set(
        100,
        100,
        100
    );

    scene.add(directional);


    /* CREATE UNIVERSE */

    createStarfield();

    createEarth();

    createSun();

    createWarpStars();


    /* LOAD SHIP */

    loadShip();


    /* DESTINATION UI */

    setupCategories();

    showDestinations("planet");


    /* INPUT */

    setupControls();

    window.addEventListener(
        "resize",
        resize
    );


    /* START */

    animate();

}


/* =========================================================
   STARFIELD
========================================================= */

function createStarfield() {

    const count = 12000;

    const geometry =
        new THREE.BufferGeometry();

    const positions =
        new Float32Array(
            count * 3
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const radius =
            300 +
            Math.random() * 3000;

        const theta =
            Math.random() *
            Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        positions[i * 3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        positions[i * 3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        positions[i * 3 + 2] =
            radius *
            Math.cos(phi);

    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: 0xffffff,

            size: 1.4,

            sizeAttenuation: true

        });


    stars =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(stars);

}


/* =========================================================
   WARP STARS
========================================================= */

function createWarpStars() {

    const count = 1800;

    const geometry =
        new THREE.BufferGeometry();

    const positions =
        new Float32Array(
            count * 3
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        positions[i * 3] =
            (Math.random() - .5) *
            120;

        positions[i * 3 + 1] =
            (Math.random() - .5) *
            70;

        positions[i * 3 + 2] =
            -Math.random() *
            800;

    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({

            color: 0x8fc9ff,

            size: 2,

            transparent: true,

            opacity: 0

        });

    warpStars =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(warpStars);

}


/* =========================================================
   EARTH
========================================================= */

function createEarth() {

    const geometry =
        new THREE.SphereGeometry(
            18,
            64,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({

            color: 0x164d9b,

            roughness: .8,

            metalness: .05

        });

    earth =
        new THREE.Mesh(
            geometry,
            material
        );

    earth.position.set(
        0,
        -35,
        -90
    );

    scene.add(earth);


    /* ATMOSPHERE */

    const atmosphereGeometry =
        new THREE.SphereGeometry(
            18.8,
            32,
            16
        );

    const atmosphereMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x3c9cff,

            transparent: true,

            opacity: .12,

            side:
                THREE.BackSide

        });

    const atmosphere =
        new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial
        );

    earth.add(atmosphere);

}


/* =========================================================
   SUN
========================================================= */

function createSun() {

    const geometry =
        new THREE.SphereGeometry(
            25,
            32,
            16
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xffc34d
        });

    sun =
        new THREE.Mesh(
            geometry,
            material
        );

    sun.position.set(
        120,
        80,
        -250
    );

    scene.add(sun);


    const light =
        new THREE.PointLight(
            0xffe5b0,
            3,
            1000
        );

    light.position.copy(
        sun.position
    );

    scene.add(light);

}


/* =========================================================
   SHIP
========================================================= */

function loadShip() {
      

    loadingText.textContent =
        "Loading IXS Enterprise...";

    const loader =
        new GLTFLoader();

    loader.load(

        "ixsenterprise.glb",

        function(gltf) {

            ship =
                gltf.scene;

            ship.scale.set(
                1,
                1,
                1
            );

            ship.position.set(
                0,
                0,
                0
            );


            /* AUTO CENTER */

            const box =
                new THREE.Box3()
                    .setFromObject(ship);

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );

            ship.position.sub(
                center
            );


            /* FIT SHIP */

            const size =
                box.getSize(
                    new THREE.Vector3()
                );

            const largest =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            if (largest > 0) {

                const scale =
                    5 / largest;

                ship.scale.setScalar(
                    scale
                );

            }


            scene.add(ship);


            loaderProgress.style.width =
                "100%";

            loadingText.textContent =
                "Universe ready.";


            setTimeout(() => {

                loading.style.display =
                    "none";

            }, 700);

        },

        function(progress) {

            if (
                progress.total > 0
            ) {

                const percent =
                    progress.loaded /
                    progress.total *
                    100;

                loaderProgress.style.width =
                    percent + "%";

            }

        },

        function(error) {

            console.error(error);

            loadingText.innerHTML =
                "Could not load IXS Enterprise.<br>" +
                "Make sure <b>ixsenterprise.glb</b> " +
                "is beside index.html.";

            loaderProgress.style.width =
                "100%";

        }

    );

}


/* =========================================================
   DESTINATION UI
========================================================= */

function setupCategories() {

    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(b =>
                            b.classList.remove(
                                "active"
                            )
                        );

                    button.classList.add(
                        "active"
                    );

                    showDestinations(
                        button.dataset.type
                    );

                }
            );

        });

}


function showDestinations(type) {

    destinationsElement.innerHTML =
        "";

    destinations[type].forEach(
        destination => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "destination";

            element.innerHTML = `

                <div class="destinationName">
                    ${destination.name}
                </div>

                <div class="destinationInfo">
                    ${destination.description}
                </div>

            `;

            element.addEventListener(
                "click",
                () => {

                    selectedDestination =
                        destination;

                    document
                        .querySelectorAll(
                            ".destination"
                        )
                        .forEach(
                            d =>
                            d.style.borderColor =
                            "rgba(255,255,255,.08)"
                        );

                    element.style.borderColor =
                        "#56aaff";

                }
            );

            destinationsElement.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   TRAVEL
========================================================= */

travelButton.addEventListener(
    "click",
    startWarp
);


function startWarp() {

    if (
        isWarping ||
        !selectedDestination
    ) {
        return;
    }

    isWarping = true;

    travelButton.disabled =
        true;

    warp.classList.remove(
        "active"
    );

    warpText.classList.remove(
        "active"
    );


    void warp.offsetWidth;


    warp.classList.add(
        "active"
    );

    warpText.textContent =
        "INITIATING WARP";

    warpText.classList.add(
        "active"
    );


    warpStars.material.opacity =
        1;


    const start =
        performance.now();

    const duration =
        4000;


    function warpAnimation(
        now
    ) {

        const progress =
            Math.min(
                (now - start) /
                duration,
                1
            );


        /* accelerate */

        const speed =
            2 +
            progress *
            progress *
            100;


        const position =
            warpStars.geometry
                .attributes
                .position
                .array;


        for (
            let i = 0;
            i < position.length;
            i += 3
        ) {

            position[i + 2] +=
                speed;

            if (
                position[i + 2] > 20
            ) {

                position[i + 2] =
                    -800;

            }

        }


        warpStars.geometry
            .attributes
            .position
            .needsUpdate = true;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                warpAnimation
            );

        } else {

            finishWarp();

        }

    }


    requestAnimationFrame(
        warpAnimation
    );

}


function finishWarp() {

    const destination =
        selectedDestination;

    locationElement.textContent =
        "LOCATION: " +
        destination.name.toUpperCase();


    createDestinationScene(
        destination
    );


    warpStars.material.opacity =
        0;

    warp.classList.remove(
        "active"
    );

    warpText.classList.remove(
        "active"
    );


    travelButton.disabled =
        false;

    isWarping = false;

}


/* =========================================================
   DESTINATION OBJECTS
========================================================= */

function clearDestinationObjects() {

    destinationObjects
        .forEach(object => {

            scene.remove(
                object
            );

            object.traverse(
                child => {

                    if (
                        child.geometry
                    ) {

                        child.geometry.dispose();

                    }

                    if (
                        child.material
                    ) {

                        if (
                            Array.isArray(
                                child.material
                            )
                        ) {

                            child.material
                                .forEach(
                                    m =>
                                    m.dispose()
                                );

                        } else {

                            child.material
                                .dispose();

                        }

                    }

                }
            );

        });

    destinationObjects =
        [];

}


function createDestinationScene(
    destination
) {

    clearDestinationObjects();


    const type =
        destination.type;


    if (
        type === "earth"
    ) {

        createPlanet(
            destination.position,
            20,
            0x1b63ad,
            "Earth"
        );

    }


    else if (
        type === "moon"
    ) {

        createPlanet(
            destination.position,
            14,
            0x888888,
            "Moon"
        );

    }


    else if (
        type === "mars"
    ) {

        createPlanet(
            destination.position,
            17,
            0xb84d32,
            "Mars"
        );

    }


    else if (
        type === "jupiter"
    ) {

        createGasGiant(
            destination.position
        );

    }


    else if (
        type === "saturn"
    ) {

        createSaturn(
            destination.position
        );

    }


    else if (
        type === "star" ||
        type === "redstar"
    ) {

        createStar(
            destination.position,
            type === "redstar"
                ? 0xff4d36
                : 0xffe6a0
        );

    }


    else if (
        type === "blackhole"
    ) {

        createBlackHole(
            destination.position
        );

    }


    else if (
        type === "nebula"
    ) {

        createNebula(
            destination.position
        );

    }


    else if (
        type === "galaxy"
    ) {

        createGalaxy(
            destination.position
        );

    }

}


/* =========================================================
   PLANET
========================================================= */

function createPlanet(
    position,
    radius,
    color,
    name
) {

    const geometry =
        new THREE.SphereGeometry(
            radius,
            48,
            24
        );

    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            roughness: .9

        });

    const planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.position.copy(
        position
    );

    scene.add(
        planet
    );

    destinationObjects.push(
        planet
    );

}


/* =========================================================
   JUPITER
========================================================= */

function createGasGiant(

) {

    const geometry =
        new THREE.SphereGeometry(
            22,
            48,
            24
        );

/* =========================================================
   SATURN
========================================================= */

function createSaturn(
    position
) {

    createPlanet(
        position,
        20,
        0xc9a66b,
        "Saturn"
    );

    const ringGeometry =
        new THREE.RingGeometry(
            28,
            48,
            64
        );

    const ringMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xc8b99a,

            transparent: true,

            opacity: .65,

            side:
                THREE.DoubleSide

        });

    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );

    ring.position.copy(

    );

    ring.rotation.x =
        Math.PI / 2.4;

    scene.add(
        ring
    );

    destinationObjects.push(
        ring
    );

}


/* =========================================================
   STAR
========================================================= */

function createStar(
    position,
    color
) {

    const geometry =
        new THREE.SphereGeometry(
            28,
            32,
            16
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: color
        });

    const object =
        new THREE.Mesh(
            geometry,
            material
        );

    object.position.copy(
        position
    );

    scene.add(
        object
    );

    destinationObjects.push(
        object
    );


    const light =
        new THREE.PointLight(
            color,
            5,
            800
        );

    light.position.copy(
        position
    );

    scene.add(
        light
    );

    destinationObjects.push(
        light
    );

}


/* =========================================================
   BLACK HOLE
========================================================= */

function createBlackHole(
    position
) {

    const group =
        new THREE.Group();

    group.position.copy(
        position
    );


    /* EVENT HORIZON */

    const blackGeometry =
        new THREE.SphereGeometry(
            18,
            32,
            16
        );

    const blackMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x000000
        });

    const black =
        new THREE.Mesh(
            blackGeometry,
            blackMaterial
        );

    group.add(
        black
    );


    /* ACCRETION DISK */

    const diskGeometry =
        new THREE.RingGeometry(
            22,
            65,
            96
        );

    const diskMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xff7a22,

            transparent: true,

            opacity: .7,

            side:
                THREE.DoubleSide

        });

    const disk =
        new THREE.Mesh(
            diskGeometry,
            diskMaterial
        );

    disk.rotation.x =
        Math.PI / 2;

    group.add(
        disk
    );


    scene.add(
        group
    );

    destinationObjects.push(
        group
    );

}


/* =========================================================
   NEBULA
========================================================= */

function createNebula(
    position
) {

    const group =
        new THREE.Group();

    group.position.copy(
        position
    );


    const geometry =
        new THREE.BufferGeometry();

    const count = 1500;

    const positions =
        new Float32Array(
            count * 3
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const radius =
            Math.random() * 90;

        const angle =
            Math.random() *
            Math.PI * 2;

        positions[i * 3] =
            Math.cos(angle) *
            radius;

        positions[i * 3 + 1] =
            (Math.random() - .5) *
            70;

        positions[i * 3 + 2] =
            Math.sin(angle) *
            radius;

    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: 0xb76cff,

            size: 3,

            transparent: true,

            opacity: .5

        });


    const particles =
        new THREE.Points(
            geometry,
            material
        );

    group.add(
        particles
    );

    scene.add(
        group
    );

    destinationObjects.push(
        group
    );

}


/* =========================================================
   GALAXY
========================================================= */

function createGalaxy(
    position
) {

    const geometry =
        new THREE.BufferGeometry();

    const count = 5000;

    const positions =
        new Float32Array(
            count * 3
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const radius =
            Math.random() *
            100;

        const angle =
            radius * .08 +
            Math.random() * .4;

        positions[i * 3] =
            Math.cos(angle) *
            radius;

        positions[i * 3 + 1] =
            (Math.random() - .5) *
            10;

        positions[i * 3 + 2] =
            Math.sin(angle) *
            radius;

    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: 0xc8a6ff,

            size: 1.8

        });


    const galaxy =
        new THREE.Points(
            geometry,
            material
        );

    galaxy.position.copy(
        position
    );

    galaxy.rotation.x =
        .4;

    scene.add(
        galaxy
    );

    destinationObjects.push(
        galaxy
    );

}


/* =========================================================
   TOUCH / MOUSE SHIP CONTROL
========================================================= */

let dragging = false;

let previousX = 0;
let previousY = 0;

let targetRotationX = 0;
let targetRotationY = 0;

let currentRotationX = 0;
let currentRotationY = 0;

let zoom = 12;

let pinchDistance = null;


function setupControls() {

    renderer.domElement.addEventListener(
        "pointerdown",
        event => {

            dragging = true;

            previousX =
                event.clientX;

            previousY =
                event.clientY;

        }
    );


    renderer.domElement.addEventListener(
        "pointermove",
        event => {

            if (!dragging || !ship) {
                return;
            }

            const dx =
                event.clientX -
                previousX;

            const dy =
                event.clientY -
                previousY;


            targetRotationY +=
                dx * .008;

            targetRotationX +=
                dy * .008;


            targetRotationX =
                THREE.MathUtils.clamp(
                    targetRotationX,
                    -1.4,
                    1.4
                );


            previousX =
                event.clientX;

            previousY =
                event.clientY;

        }
    );


    renderer.domElement.addEventListener(
        "pointerup",
        () => {

            dragging = false;

        }
    );


    renderer.domElement.addEventListener(
        "pointercancel",
        () => {

            dragging = false;

        }
    );


    renderer.domElement.addEventListener(
        "wheel",
        event => {

            zoom +=
                event.deltaY *
                .01;

            zoom =
                THREE.MathUtils.clamp(
                    zoom,
                    6,
                    30
                );

        }
    );


    /* TOUCH PINCH */

    renderer.domElement.addEventListener(
        "touchstart",
        event => {

            if (
                event.touches.length === 2
            ) {

                pinchDistance =
                    getPinchDistance(
                        event.touches
                    );

            }

        },
        { passive: false }
    );


    renderer.domElement.addEventListener(
        "touchmove",
        event => {

            if (
                event.touches.length === 2 &&
                pinchDistance !== null
            ) {

                event.preventDefault();

                const newDistance =
                    getPinchDistance(
                        event.touches
                    );

                const difference =
                    newDistance -
                    pinchDistance;

                zoom -=
                    difference *
                    .03;

                zoom =
                    THREE.MathUtils.clamp(
                        zoom,
                        6,
                        30
                    );

                pinchDistance =
                    newDistance;

            }

        },
        { passive: false }
    );


    renderer.domElement.addEventListener(
        "touchend",
        () => {

            pinchDistance = null;

        }
    );

}


function getPinchDistance(
    touches
) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   UPDATE SHIP
========================================================= */

function updateShip() {

    if (!ship) {
        return;
    }


    currentRotationX +=
        (targetRotationX -
         currentRotationX) *
        .12;

    currentRotationY +=
        (targetRotationY -
         currentRotationY) *
        .12;


    ship.rotation.x =
        currentRotationX;

    ship.rotation.y =
        currentRotationY;


    /* CAMERA */

    camera.position.z +=
        (zoom -
         camera.position.z) *
        .08;


    camera.lookAt(
        0,
        0,
        0
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const elapsed =
        clock.getElapsedTime();


    /* STAR ROTATION */

    if (stars) {

        stars.rotation.y =
            elapsed * .002;

    }


    /* EARTH ROTATION */

    if (earth) {

        earth.rotation.y +=
            .001;

    }


    /* SUN */

    if (sun) {

        sun.rotation.y +=
            .0005;

    }


    /* DESTINATION OBJECTS */

    destinationObjects
        .forEach(object => {

            if (
                object.userData &&
                object.userData.rotate
            ) {

                object.rotation.y +=
                    .002;

            }

        });


    updateShip();


    renderer.render(
        scene,
        camera
    );


    /* FPS */

    frameCount++;

    const now =
        performance.now();

    if (
        now - lastTime >= 1000
    ) {

        fpsElement.textContent =
            "FPS: " +
            frameCount;

        frameCount = 0;

        lastTime = now;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   START
========================================================= */

init();

</script>
