<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>THE INTERSTELLAR TRAVELER</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 0;
}

#interface {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.panel {
    background: rgba(3, 12, 28, 0.82);
    border: 1px solid rgba(70, 190, 255, 0.65);
    box-shadow: 0 0 12px rgba(0, 145, 255, 0.15);
    padding: 10px;
    border-radius: 6px;
    backdrop-filter: blur(5px);
}

#title {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #8eeaff;
}

#telemetry {
    position: absolute;
    top: 54px;
    left: 10px;
    font-size: 11px;
    line-height: 1.8;
    min-width: 150px;
}

.label {
    color: #79bfff;
}

.value {
    color: #fff;
    font-weight: bold;
}

#status {
    position: absolute;
    top: 10px;
    right: 10px;
    max-width: 53%;
    font-size: 11px;
    line-height: 1.5;
    color: #a8ffdb;
    overflow-wrap: anywhere;
}

#loadButton {
    position: absolute;
    top: 100px;
    right: 10px;
    pointer-events: auto;
    border: 1px solid #56dfff;
    background: rgba(0, 40, 75, 0.95);
    color: #fff;
    border-radius: 5px;
    padding: 12px 13px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

#loadButton:active {
    background: #087ca8;
}

#fileInput {
    display: none;
}

#loadingBox {
    display: none;
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    width: min(85%, 340px);
    text-align: center;
    pointer-events: none;
}

#loadingText {
    font-size: 13px;
    color: #b8edff;
    margin-bottom: 12px;
}

#loadingTrack {
    height: 5px;
    background: #152d43;
    border-radius: 5px;
    overflow: hidden;
}

#loadingBar {
    height: 100%;
    width: 0%;
    background: #36d8ff;
    transition: width 0.2s;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(120, 230, 255, 0.75);
    border-radius: 50%;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: rgba(120, 230, 255, 0.75);
}

#crosshair::before {
    width: 32px;
    height: 1px;
    left: -6px;
    top: 10px;
}

#crosshair::after {
    width: 1px;
    height: 32px;
    left: 10px;
    top: -6px;
}

#bottomInfo {
    position: absolute;
    bottom: 12px;
    left: 10px;
    font-size: 10px;
    line-height: 1.7;
    max-width: 43%;
}

#mapCanvas {
    width: 120px;
    height: 120px;
    display: block;
    background: rgba(0, 10, 25, 0.88);
    border: 1px solid #438bb4;
    border-radius: 5px;
}

#mapPanel {
    position: absolute;
    right: 10px;
    bottom: 12px;
    width: 130px;
    pointer-events: none;
}

#mapTitle {
    font-size: 10px;
    color: #8eeaff;
    margin-bottom: 5px;
    letter-spacing: 1px;
}

#controls {
    position: absolute;
    bottom: 150px;
    right: 15px;
    display: grid;
    grid-template-columns: 54px 54px 54px;
    grid-template-rows: 48px 48px 48px;
    gap: 5px;
    pointer-events: auto;
}

.ctrl {
    background: rgba(0, 40, 75, 0.75);
    border: 1px solid rgba(100, 205, 255, 0.7);
    color: #fff;
    border-radius: 8px;
    font-size: 18px;
    touch-action: none;
    user-select: none;
}

.ctrl:active,
.ctrl.active {
    background: rgba(0, 145, 220, 0.9);
}

#pitchUp { grid-column: 2; grid-row: 1; }
#yawLeft { grid-column: 1; grid-row: 2; }
#pitchDown { grid-column: 2; grid-row: 3; }
#yawRight { grid-column: 3; grid-row: 2; }

#rollLeft { grid-column: 1; grid-row: 1; font-size: 13px; }
#rollRight { grid-column: 3; grid-row: 1; font-size: 13px; }

#throttleControls {
    position: absolute;
    left: 10px;
    bottom: 115px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: auto;
}

.throttleButton {
    width: 105px;
    padding: 11px 5px;
    border-radius: 6px;
    background: rgba(0, 40, 75, 0.8);
    border: 1px solid #56dfff;
    color: white;
    font-size: 10px;
    font-weight: bold;
    touch-action: none;
}

#resetButton {
    position: absolute;
    left: 10px;
    top: 210px;
    pointer-events: auto;
    padding: 9px 11px;
    font-size: 10px;
    color: white;
    background: rgba(40, 20, 40, 0.8);
    border: 1px solid #ba9cff;
    border-radius: 5px;
}

#help {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    font-size: 9px;
    color: #9bb8cc;
    text-align: center;
    width: 42%;
}

@media (max-width: 600px) {
    #title {
        font-size: 10px;
        letter-spacing: 1px;
    }

    #telemetry {
        top: 43px;
        font-size: 10px;
        min-width: 120px;
    }

    #status {
        font-size: 9px;
        max-width: 48%;
    }

    #loadButton {
        top: 90px;
        font-size: 10px;
        padding: 10px;
    }

    #controls {
        bottom: 145px;
        right: 8px;
        grid-template-columns: 46px 46px 46px;
        grid-template-rows: 43px 43px 43px;
        gap: 4px;
    }

    .ctrl {
        font-size: 16px;
    }

    #mapPanel {
        width: 94px;
        right: 8px;
        bottom: 8px;
    }

    #mapCanvas {
        width: 88px;
        height: 88px;
    }

    #mapTitle {
        font-size: 8px;
    }

    #bottomInfo {
        bottom: 8px;
        left: 8px;
        font-size: 9px;
    }

    #throttleControls {
        left: 8px;
        bottom: 105px;
    }

    .throttleButton {
        width: 90px;
        padding: 9px 3px;
        font-size: 9px;
    }

    #resetButton {
        top: 190px;
        left: 8px;
    }

    #help {
        display: none;
    }
}
</style>

{
  "imports": {

  }

<body>

<div id="interface">

    <div id="title" class="panel">
        THE INTERSTELLAR TRAVELER
    </div>

    <div id="telemetry" class="panel">
        <div><span class="label">SPEED:</span>
            <span class="value" id="speed">0</span> m/s
        </div>
        <div><span class="label">THROTTLE:</span>
            <span class="value" id="throttleValue">0</span>%
        </div>
        <div><span class="label">ALTITUDE:</span>
            <span class="value" id="altitude">0</span> km
        </div>
        <div><span class="label">SHIP:</span>
            <span class="value" id="shipState">DEFAULT</span>
        </div>
    </div>

    <div id="status" class="panel">
        SYSTEM READY — SELECT A SHIP MODEL
    </div>

    <button id="loadButton">LOAD SPACESHIP (.GLB)</button>
    <input id="fileInput" type="file" accept=".glb,.gltf">

    <div id="loadingBox" class="panel">
        <div id="loadingText">Loading spaceship...</div>
        <div id="loadingTrack">
            <div id="loadingBar"></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <button id="resetButton">RESET FLIGHT</button>

    <div id="throttleControls">
        <button class="throttleButton" id="throttleUp">THROTTLE +</button>
        <button class="throttleButton" id="throttleDown">THROTTLE −</button>
        <button class="throttleButton" id="brakeButton">BRAKE</button>
    </div>

    <div id="controls">
        <button class="ctrl" id="rollLeft">ROLL ↶</button>
        <button class="ctrl" id="pitchUp">▲</button>
        <button class="ctrl" id="rollRight">ROLL ↷</button>
        <button class="ctrl" id="yawLeft">◀</button>
        <button class="ctrl" id="pitchDown">▼</button>
        <button class="ctrl" id="yawRight">▶</button>
    </div>

    <div id="bottomInfo" class="panel">
        NAVIGATION: ACTIVE<br>
        ENGINE: ONLINE<br>
        SYSTEM: <span id="systemName">SOL</span>
    </div>

    <div id="mapPanel">
        <div id="mapTitle">NAVIGATION MAP</div>
        <canvas id="mapCanvas" width="240" height="240"></canvas>
    </div>

    <div id="help">
        Keyboard: W/S throttle · ↑/↓ pitch · ←/→ turn · A/D roll
    </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
const loadButton = document.getElementById('loadButton');
const loadingBox = document.getElementById('loadingBox');
const loadingText = document.getElementById('loadingText');
const loadingBar = document.getElementById('loadingBar');

function setStatus(message) {
    statusEl.textContent = message;
}

function showLoading(message, progress = 0) {
    loadingBox.style.display = 'block';
    loadingText.textContent = message;
    loadingBar.style.width = `${Math.max(0, Math.min(100, progress))}%`;
}

function hideLoading() {
    loadingBox.style.display = 'none';
}

let scene, camera, renderer, clock;
let shipRoot, shipVisual, fallbackShip;
let shipModel = null;
let currentLoadToken = 0;

let throttle = 0;
let speed = 0;
let maxSpeed = 300;
let braking = false;

const keys = Object.create(null);
const planets = [];
const stars = [];
const controlState = {
    pitchUp: false,
    pitchDown: false,
    yawLeft: false,
    yawRight: false,
    rollLeft: false,
    rollRight: false
};

const UP = new THREE.Vector3(0, 1, 0);
const tempVec = new THREE.Vector3();

init();
animate();

/* -------------------------------------------------------
   INITIALIZE GAME
------------------------------------------------------- */

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040b);
    scene.fog = new THREE.FogExp2(0x02040b, 0.00022);

    camera = new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        0.1,
        100000
    );

    renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    createLighting();
    createStars();
    createPlanets();
    createShip();
    createControls();

    camera.position.set(0, 5, 17);
    camera.lookAt(shipRoot.position);

    window.addEventListener('resize', onResize);

    setStatus('SYSTEM READY — SELECT A GLB SPACESHIP');
}

/* -------------------------------------------------------
   LIGHTING
------------------------------------------------------- */

function createLighting() {
    const ambient = new THREE.HemisphereLight(
        0x9ebdff,
        0x080b20,
        1.4
    );

    scene.add(ambient);

    const sunLight = new THREE.PointLight(0xffffff, 3000, 10000);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x76bfff, 1.5);
    fillLight.position.set(-10, 20, 10);
    scene.add(fillLight);
}

/* -------------------------------------------------------
   STAR FIELD
------------------------------------------------------- */

function createStars() {
    const count = 5000;
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
        const radius = 1800 + Math.random() * 8000;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i * 3] =
            radius * Math.sin(phi) * Math.cos(theta);

        positions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);

        positions[i * 3 + 2] =
            radius * Math.cos(phi);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 2.2,
        sizeAttenuation: true
    });

    const starField = new THREE.Points(geometry, material);
    scene.add(starField);
    stars.push(starField);
}

/* -------------------------------------------------------
   PROCEDURAL PLANETS
------------------------------------------------------- */

function createPlanetTexture(baseColor, seed) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let randomSeed = seed;

    function random() {
        randomSeed = (randomSeed * 9301 + 49297) % 233280;
        return randomSeed / 233280;
    }

    for (let i = 0; i < 1000; i++) {
        const x = random() * canvas.width;
        const y = random() * canvas.height;
        const w = 5 + random() * 65;
        const h = 2 + random() * 20;

        const light = random() > 0.5;
        ctx.fillStyle = light
            ? 'rgba(255,255,255,0.12)'
            : 'rgba(0,0,0,0.16)';

        ctx.beginPath();
        ctx.ellipse(x, y, w, h, random() * 0.3, 0,
            Math.PI * 2);
        ctx.fill();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

function createPlanets() {
    const data = [
        {
            name: 'MERCURY',
            size: 4,
            distance: 80,
            color: '#8a8074',
            seed: 11
        },
        {
            name: 'VENUS',
            size: 7,
            distance: 125,
            color: '#d6a46d',
            seed: 22
        },
        {
            name: 'EARTH',
            size: 8,
            distance: 185,
            color: '#1765b5',
            seed: 33
        },
        {
            name: 'MARS',
            size: 6,
            distance: 250,
            color: '#a94f32',
            seed: 44
        },
        {
            name: 'JUPITER',
            size: 26,
            distance: 390,
            color: '#c69b77',
            seed: 55
        },
        {
            name: 'SATURN',
            size: 22,
            distance: 560,
            color: '#d6c092',
            seed: 66
        },
        {
            name: 'URANUS',
            size: 15,
            distance: 730,
            color: '#7dcdd7',
            seed: 77
        },
        {
            name: 'NEPTUNE',
            size: 15,
            distance: 890,
            color: '#3154c5',
            seed: 88
        }
    ];

    data.forEach((item, index) => {
        const geometry = new THREE.SphereGeometry(
            item.size,
            40,
            32
        );

        const material = new THREE.MeshStandardMaterial({
            map: createPlanetTexture(item.color, item.seed),
            roughness: 0.95,
            metalness: 0
        });

        const planet = new THREE.Mesh(geometry, material);

        const angle = index * 0.9 + 0.5;

        planet.position.set(
            Math.cos(angle) * item.distance,
            (index % 3 - 1) * 5,
            Math.sin(angle) * item.distance
        );

        planet.userData.name = item.name;
        planet.userData.distance = item.distance;
        planet.userData.angle = angle;
        planet.userData.orbitSpeed = 0.00015 / (index + 1);

        scene.add(planet);
        planets.push(planet);

        if (item.name === 'SATURN') {
            const ringGeometry = new THREE.RingGeometry(
                item.size * 1.35,
                item.size * 2.1,
                64
            );

            const ringMaterial = new THREE.MeshStandardMaterial({
                color: 0xb9a27d,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7
            });

            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2.3;
            planet.add(ring);
        }
    });

    // A distant star representing the system's sun.
    const sun = new THREE.Mesh(
        new THREE.SphereGeometry(18, 32, 24),
        new THREE.MeshBasicMaterial({ color: 0xffd27a })
    );

    sun.position.set(0, 0, 0);
    scene.add(sun);
}

/* -------------------------------------------------------
   DEFAULT SHIP
------------------------------------------------------- */

function createShip() {
    shipRoot = new THREE.Group();
    scene.add(shipRoot);

    shipVisual = new THREE.Group();
    shipRoot.add(shipVisual);

    fallbackShip = createFallbackShip();
    shipVisual.add(fallbackShip);
}

function createFallbackShip() {
    const group = new THREE.Group();

    const hullMaterial = new THREE.MeshStandardMaterial({
        color: 0x9cb9d7,
        metalness: 0.75,
        roughness: 0.3
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
        color: 0x1b304b,
        metalness: 0.6,
        roughness: 0.25
    });

    const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x36cfff
    });

    const hull = new THREE.Mesh(
        new THREE.ConeGeometry(1.15, 4.5, 8),
        hullMaterial
    );

    // The cone's tip points upward by default.
    // Rotate it so the ship points forward along -Z.
    hull.rotation.x = -Math.PI / 2;
    hull.position.z = -0.5;
    group.add(hull);

    const cockpit = new THREE.Mesh(
        new THREE.SphereGeometry(0.58, 16, 12),
        darkMaterial
    );

    cockpit.scale.set(0.85, 0.55, 1.25);
    cockpit.position.set(0, 0.65, -0.15);
    group.add(cockpit);

    const wingGeometry = new THREE.BoxGeometry(4.4, 0.13, 1.25);

    const wings = new THREE.Mesh(wingGeometry, hullMaterial);
    wings.position.set(0, -0.1, 0.7);
    group.add(wings);

    const engineGeometry = new THREE.CylinderGeometry(
        0.24, 0.34, 0.8, 12
    );

    for (const x of [-0.55, 0.55]) {
        const engine = new THREE.Mesh(engineGeometry, darkMaterial);
        engine.rotation.x = Math.PI / 2;
        engine.position.set(x, -0.1, 1.7);
        group.add(engine);

        const flame = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 12, 10),
            glowMaterial
        );

        flame.scale.set(0.7, 0.7, 1.8);
        flame.position.set(x, -0.1, 2.2);
        group.add(flame);
    }

    return group;
}

/* -------------------------------------------------------
   ROBUST GLB LOADING
------------------------------------------------------- */

loadButton.addEventListener('click', () => {
    fileInput.click();
});

fileInput.addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0];

    // Allow selecting the same file again later.
    fileInput.value = '';

    if (!file) return;

    const extension = file.name.split('.').pop().toLowerCase();

    if (extension !== 'glb' && extension !== 'gltf') {
        setStatus('ERROR: PLEASE SELECT A GLB OR GLTF FILE');
        return;
    }

    if (extension === 'gltf') {
        setStatus(
            'TIP: GLTF FILES MAY NEED SEPARATE TEXTURE FILES. GLB IS RECOMMENDED.'
        );
    }

    await loadShipFile(file);
});

async function loadShipFile(file) {
    const token = ++currentLoadToken;

    showLoading('Reading spaceship file...', 5);
    setStatus(`LOADING: ${file.name}`);

    try {
        // Read the file asynchronously rather than blocking the render loop.
        const buffer = await file.arrayBuffer();

        if (token !== currentLoadToken) return;

        showLoading('Parsing spaceship model...', 25);

        const loader = new GLTFLoader();

        loader.parse(
            buffer,
            '',
            (gltf) => {
                if (token !== currentLoadToken) {
                    disposeObject(gltf.scene);
                    return;
                }

                try {
                    const model = gltf.scene;

                    if (!model || !model.children.length) {
                        throw new Error('The selected file contains no visible model.');
                    }

                    prepareAndInstallShip(model);

                    hideLoading();

                    document.getElementById('shipState').textContent =
                        file.name.length > 16
                            ? file.name.slice(0, 13) + '...'
                            : file.name;

                    setStatus('SHIP LOADED SUCCESSFULLY: ' + file.name);
                } catch (error) {
                    hideLoading();
                    console.error(error);
                    setStatus('MODEL ERROR: ' + error.message);
                }
            },
            (error) => {
                if (token !== currentLoadToken) return;

                hideLoading();
                console.error('GLTF parse error:', error);

                setStatus(
                    'LOAD FAILED. TRY A VALID, SELF-CONTAINED GLB FILE.'
                );
            }
        );

    } catch (error) {
        if (token !== currentLoadToken) return;

        hideLoading();
        console.error(error);
        setStatus('FILE ERROR: ' + error.message);
    }
}

function prepareAndInstallShip(model) {
    // Calculate the original bounds and reject empty/invalid models.
    model.updateMatrixWorld(true);

    let box = new THREE.Box3().setFromObject(model);

    if (box.isEmpty()) {
        throw new Error('The model has no measurable geometry.');
    }

    const originalSize = new THREE.Vector3();
    box.getSize(originalSize);

    const originalMax = Math.max(
        originalSize.x,
        originalSize.y,
        originalSize.z
    );

    if (!Number.isFinite(originalMax) || originalMax < 0.00001) {
        throw new Error('The model has invalid dimensions.');
    }

    // Keep very large and very small models within a useful size.
    const desiredSize = 7;
    const scaleFactor = desiredSize / originalMax;

    model.scale.multiplyScalar(scaleFactor);
    model.updateMatrixWorld(true);

    // Center the scaled model around the ship's origin.
    box = new THREE.Box3().setFromObject(model);

    const center = new THREE.Vector3();
    box.getCenter(center);

    model.position.sub(center);
    model.updateMatrixWorld(true);

    // Ensure the new model is prepared before touching the current ship.
    const newContainer = new THREE.Group();
    newContainer.add(model);

    // Only replace the old ship AFTER successful loading and preparation.
    if (shipModel) {
        shipVisual.remove(shipModel);
        disposeObject(shipModel);
    }

    if (fallbackShip) {
        shipVisual.remove(fallbackShip);
        disposeObject(fallbackShip);
        fallbackShip = null;
    }

    shipModel = newContainer;
    shipVisual.add(shipModel);

    // Reset visual orientation and scale.
    shipVisual.rotation.set(0, 0, 0);
    shipVisual.scale.set(1, 1, 1);

    // If the GLB has invisible material settings, make meshes renderable
    // without replacing their existing materials.
    shipModel.traverse((object) => {
        if (!object.isMesh) return;

        object.visible = true;
        object.frustumCulled = false;

        if (object.material) {
            const materials = Array.isArray(object.material)
                ? object.material
                : [object.material];

            materials.forEach((material) => {
                if ('visible' in material) material.visible = true;
                material.needsUpdate = true;
            });
        }
    });
}

function disposeObject(object) {
    if (!object) return;

    object.traverse((child) => {
        if (!child.isMesh) return;

        if (child.geometry) {
            child.geometry.dispose();
        }

        if (child.material) {
            const materials = Array.isArray(child.material)
                ? child.material
                : [child.material];

            materials.forEach((material) => {
                // Do not dispose textures here: GLTF materials may share them.
                material.dispose();
            });
        }
    });
}

/* -------------------------------------------------------
   FLIGHT CONTROLS
------------------------------------------------------- */

function createControls() {
    const controlIds = Object.keys(controlState);

    controlIds.forEach((id) => {
        const button = document.getElementById(id);

        button.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            controlState[id] = true;
            button.classList.add('active');
            button.setPointerCapture?.(event.pointerId);
        });

        const release = (event) => {
            event.preventDefault();
            controlState[id] = false;
            button.classList.remove('active');
        };

        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', () => {
            controlState[id] = false;
            button.classList.remove('active');
        });
    });

    const throttleUp = document.getElementById('throttleUp');
    const throttleDown = document.getElementById('throttleDown');
    const brakeButton = document.getElementById('brakeButton');

    throttleUp.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        throttle = Math.min(100, throttle + 10);
    });

    throttleDown.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        throttle = Math.max(0, throttle - 10);
    });

    brakeButton.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        braking = true;
    });

    const stopBrake = () => braking = false;

    brakeButton.addEventListener('pointerup', stopBrake);
    brakeButton.addEventListener('pointercancel', stopBrake);
    brakeButton.addEventListener('lostpointercapture', stopBrake);

    document.getElementById('resetButton').addEventListener('click', resetFlight);

    window.addEventListener('keydown', (event) => {
        keys[event.code] = true;

        if ([
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
            'Space'
        ].includes(event.code)) {
            event.preventDefault();
        }

        if (event.code === 'KeyW') throttle = Math.min(100, throttle + 2);
        if (event.code === 'KeyS') throttle = Math.max(0, throttle - 2);
    });

    window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
    });

    window.addEventListener('blur', () => {
        Object.keys(keys).forEach((key) => keys[key] = false);
        Object.keys(controlState).forEach((key) => controlState[key] = false);
        braking = false;
    });
}

function resetFlight() {
    shipRoot.position.set(0, 0, 0);
    shipRoot.rotation.set(0, 0, 0);

    throttle = 0;
    speed = 0;

    setStatus('FLIGHT RESET — SYSTEM READY');
}

/* -------------------------------------------------------
   FLIGHT PHYSICS
------------------------------------------------------- */

function updateFlight(delta) {
    const rotationSpeed = 1.15;
    const acceleration = 95;

    if (keys.ArrowUp || controlState.pitchUp) {
        shipRoot.rotateX(rotationSpeed * delta);
    }

    if (keys.ArrowDown || controlState.pitchDown) {
        shipRoot.rotateX(-rotationSpeed * delta);
    }

    if (keys.ArrowLeft || controlState.yawLeft) {
        shipRoot.rotateY(rotationSpeed * delta);
    }

    if (keys.ArrowRight || controlState.yawRight) {
        shipRoot.rotateY(-rotationSpeed * delta);
    }

    if (keys.KeyA || controlState.rollLeft) {
        shipRoot.rotateZ(rotationSpeed * delta);
    }

    if (keys.KeyD || controlState.rollRight) {
        shipRoot.rotateZ(-rotationSpeed * delta);
    }

    if (keys.KeyW) {
        throttle = Math.min(100, throttle + 35 * delta);
    }

    if (keys.KeyS) {
        throttle = Math.max(0, throttle - 35 * delta);
    }

    const targetSpeed = throttle / 100 * maxSpeed;

    if (braking || keys.Space) {
        speed = Math.max(0, speed - 180 * delta);
    } else {
        speed += (targetSpeed - speed) *
            Math.min(1, acceleration / maxSpeed * delta);
    }

    // Spaceship forward is its local -Z axis.
    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyQuaternion(shipRoot.quaternion);

    shipRoot.position.addScaledVector(forward, speed * delta);

    // Prevent numeric errors from building up during long sessions.
    if (!Number.isFinite(shipRoot.position.x) ||
        !Number.isFinite(shipRoot.position.y) ||
        !Number.isFinite(shipRoot.position.z)) {
        resetFlight();
    }
}

/* -------------------------------------------------------
   CAMERA
------------------------------------------------------- */

function updateCamera(delta) {
    const cameraOffset = new THREE.Vector3(0, 4.2, 13);

    cameraOffset.applyQuaternion(shipRoot.quaternion);

    const desiredPosition = shipRoot.position.clone()
        .add(cameraOffset);

    // Smooth chase camera.
    const smoothing = 1 - Math.exp(-4 * delta);

    camera.position.lerp(desiredPosition, smoothing);

    const lookDirection = new THREE.Vector3(0, 0, -1)
        .applyQuaternion(shipRoot.quaternion);

    const target = shipRoot.position.clone()
        .addScaledVector(lookDirection, 8);

    camera.lookAt(target);
}

/* -------------------------------------------------------
   HUD AND NAVIGATION MAP
------------------------------------------------------- */

function updateHUD() {
    document.getElementById('speed').textContent =
        Math.round(speed).toLocaleString();

    document.getElementById('throttleValue').textContent =
        Math.round(throttle);

    document.getElementById('altitude').textContent =
        Math.round(shipRoot.position.length()).toLocaleString();

    let nearest = null;
    let nearestDistance = Infinity;

    planets.forEach((planet) => {
        const distance = shipRoot.position.distanceTo(planet.position);

        if (distance < nearestDistance) {
            nearestDistance = distance;
            nearest = planet;
        }
    });

    document.getElementById('systemName').textContent =
        nearest && nearestDistance < 120
            ? nearest.userData.name
            : 'SOL';
}

function updateMap() {
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#020916';
    ctx.fillRect(0, 0, w, h);

    // Grid.
    ctx.strokeStyle = 'rgba(65,135,180,0.25)';
    ctx.lineWidth = 1;

    for (let i = 0; i <= w; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, h);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(w, i);
        ctx.stroke();
    }

    const scale = 0.11;
    const cx = w / 2;
    const cy = h / 2;

    // Sun.
    ctx.fillStyle = '#ffdd77';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();

    planets.forEach((planet) => {
        const x = cx + planet.position.x * scale;
        const y = cy + planet.position.z * scale;

        if (x < 3 || x > w - 3 || y < 3 || y > h - 3) {
            return;
        }

        ctx.fillStyle = '#59bfff';
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    const sx = cx + shipRoot.position.x * scale;
    const sy = cy + shipRoot.position.z * scale;

    if (sx >= 0 && sx <= w && sy >= 0 && sy <= h) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

/* -------------------------------------------------------
   ANIMATION LOOP
------------------------------------------------------- */

function animate() {
    requestAnimationFrame(animate);

    if (!renderer || !scene || !camera) return;

    const delta = Math.min(clock.getDelta(), 0.05);

    updateFlight(delta);
    updateCamera(delta);
    updateHUD();
    updateMap();

    planets.forEach((planet) => {
        planet.rotation.y += delta * 0.04;
    });

    try {
        renderer.render(scene, camera);
    } catch (error) {
        console.error('Rendering error:', error);
        setStatus('RENDERING ERROR — CHECK THE BROWSER CONSOLE');
    }
}

function onResize() {
    if (!camera || !renderer) return;

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
